spring.datasource.url=jdbc:h2:mem:nexusmarket;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Mongo is never contacted during these tests: the driver connects lazily, so pointing at a port
# nobody listens on is enough to let the context assemble without a running MongoDB.
spring.mongodb.uri=mongodb://localhost:27017/nexusmarket_test

nexusmarket.security.jwt.secret=test-only-secret-not-used-outside-the-test-suite
nexusmarket.security.jwt.expiration-minutes=60

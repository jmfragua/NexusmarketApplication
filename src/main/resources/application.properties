spring.application.name=nexusmarket

server.port=${SERVER_PORT:8080}

# MySQL (auto-generacion de esquema relacional)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nexusmarket}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:nexusmarket}
spring.datasource.password=${MYSQL_PASSWORD:nexusmarket}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# MongoDB (bitacora de operaciones).
# En Spring Boot 4 la propiedad es spring.mongodb.uri, no spring.data.mongodb.uri: esta ultima se
# ignora en silencio y la aplicacion escribe en la base 'test' por defecto.
spring.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:nexusmarket_logs}

# Seguridad JWT
nexusmarket.security.jwt.secret=${JWT_SECRET:change-me-in-every-real-environment-please-this-is-dev-only}
nexusmarket.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Administrador inicial. Sin contrasena configurada el seeder no crea nada y lo advierte en el log:
# nadie mas puede crear un administrador, asi que sin esto el sistema queda inalcanzable.
nexusmarket.seed.admin.id=${SEED_ADMIN_ID:admin-001}
nexusmarket.seed.admin.email=${SEED_ADMIN_EMAIL:admin@nexusmarket.local}
nexusmarket.seed.admin.password=${SEED_ADMIN_PASSWORD:}
nexusmarket.seed.admin.document=${SEED_ADMIN_DOCUMENT:ADMIN-0001}

management.endpoints.web.exposure.include=health,info

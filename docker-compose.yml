services:
  mysql-db:
    image: mysql:8.4
    container_name: nexusmarket-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexusmarket}
      MYSQL_USER: ${MYSQL_USER:-nexusmarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexusmarket}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-db:
    image: mongo:7
    container_name: nexusmarket-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusmarket-app
    ports:
      - "${HOST_SERVER_PORT:-8080}:8080"
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexusmarket}
      MYSQL_USER: ${MYSQL_USER:-nexusmarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexusmarket}
      MONGO_HOST: mongo-db
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-nexusmarket_logs}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-real-environment-please-this-is-dev-only}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      SERVER_PORT: 8080
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  mongo_data:

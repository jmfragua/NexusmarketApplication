# Every value is read from the environment or from a .env file next to this file (see .env.example).
# SEED_ADMIN_PASSWORD has no default on purpose: without it no administrator is created and the
# platform is unreachable, so Compose refuses to start instead of booting a useless system.
services:
  mysql-db:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-nexusmarket}-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexusmarket}
      MYSQL_USER: ${MYSQL_USER:-nexusmarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexusmarket}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${HOST_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-db:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-nexusmarket}-mongo
    restart: always
    ports:
      - "${HOST_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nexusmarket}-app
    ports:
      - "${HOST_SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      # Databases: the Compose services by default, overridable to point at managed instances.
      MYSQL_HOST: ${MYSQL_HOST:-mysql-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexusmarket}
      MYSQL_USER: ${MYSQL_USER:-nexusmarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nexusmarket}
      MONGO_HOST: ${MONGO_HOST:-mongo-db}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-nexusmarket_logs}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      # Security
      JWT_SECRET: ${JWT_SECRET:-change-me-in-every-real-environment-please-this-is-dev-only}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Initial administrator (see SDD/Infrastructure/Bootstrap.md)
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Define SEED_ADMIN_PASSWORD (in the environment or in .env) to create the initial administrator}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@nexusmarket.local}
      SEED_ADMIN_ID: ${SEED_ADMIN_ID:-admin-001}
      SEED_ADMIN_DOCUMENT: ${SEED_ADMIN_DOCUMENT:-ADMIN-0001}
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  mongo_data:
